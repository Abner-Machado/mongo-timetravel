name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mongodb: ["6.0", "7.0", "8.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymongo
      - run: python -m unittest test_timetravel
      - uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: ${{ matrix.mongodb }}
          mongodb-replica-set: rs0
      # The demo writes a real order life cycle and asserts every reconstruction.
      - run: python demo.py "mongodb://127.0.0.1:27017/?directConnection=true"
